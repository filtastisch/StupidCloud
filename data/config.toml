[application]
name = "StupidCloud"
version = "0.1.0"
environment = "development"
debug = true

[controller]
host = "0.0.0.0"
port = 8080

[database]
type = "sqlite"
path = "./data/stupidcloud.db"

[logging]
level = "info"
format = "text"

[network]
bind_address = "0.0.0.0"
advertised_address = "127.0.0.1"

[[nodes]]
name = "local"
address = "127.0.0.1"
port = 25565
enabled = true